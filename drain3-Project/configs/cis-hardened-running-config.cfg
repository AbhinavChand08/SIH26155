!
!
version 15.x
!
! ---------------------------------------------------------------------------
! GLOBAL SERVICES
! ---------------------------------------------------------------------------
service tcp-keepalives-in
service tcp-keepalives-out
service timestamps debug datetime msec show-timezone
service timestamps log datetime msec show-timezone
service password-encryption
no service pad
no service dhcp
!
hostname R1-EDGE-01
!
! ---------------------------------------------------------------------------
! LOGGING
! ---------------------------------------------------------------------------
logging buffered 64000
logging console critical
logging trap informational
logging source-interface Loopback0
logging host 10.1.1.30
!
! ---------------------------------------------------------------------------
! ENABLE SECRET (Type 9 / scrypt)
! Running-config will display this as: enable secret 9 $9$....
! ---------------------------------------------------------------------------
enable algorithm-type scrypt secret CHANGE_ME_En@ble#Secret2026
!
! ---------------------------------------------------------------------------
! AAA
! ---------------------------------------------------------------------------
aaa new-model
!
tacacs server TACACS-SRV-1
 address ipv4 10.1.1.10
 key CHANGE_ME_Tacacs#Key2026
!
aaa group server tacacs+ TACACS-GROUP
 server name TACACS-SRV-1
 ip tacacs source-interface Loopback0
!
! Alternative if RADIUS is used instead of TACACS+:
! ip radius source-interface Loopback0
!
aaa authentication login default group TACACS-GROUP local
aaa authentication enable default group TACACS-GROUP enable
!
aaa accounting commands 15 default start-stop group TACACS-GROUP
aaa accounting connection default start-stop group TACACS-GROUP
aaa accounting exec default start-stop group TACACS-GROUP
aaa accounting network default start-stop group TACACS-GROUP
aaa accounting system default start-stop group TACACS-GROUP
!
! ---------------------------------------------------------------------------
! DOMAIN, SSH AND RSA KEYS
! ---------------------------------------------------------------------------
no ip source-route
ip domain-name example.com
ip dhcp bootp ignore
!
! Executes once when pasted; the key is stored in NVRAM, not shown in running-config
crypto key generate rsa general-keys modulus 2048
!
ip ssh time-out 60
ip ssh authentication-retries 3
ip ssh version 2
!
login on-failure log
login on-success log
!
! ---------------------------------------------------------------------------
! LOCAL USER (privilege 1, scrypt secret)
! ---------------------------------------------------------------------------
username netadmin privilege 1 algorithm-type scrypt secret CHANGE_ME_L0cal#Pass2026
!
! ---------------------------------------------------------------------------
! CONFIGURATION CHANGE LOGGING
! ---------------------------------------------------------------------------
archive
 log config
  logging enable
!
no cdp run
!
! ---------------------------------------------------------------------------
! ROUTING-PROTOCOL KEY CHAIN
! ---------------------------------------------------------------------------
key chain EIGRP-KEYCHAIN
 key 1
  key-string CHANGE_ME_Eigrp#Key2026
!
! ---------------------------------------------------------------------------
! INTERFACES
! ---------------------------------------------------------------------------
interface Loopback0
 description MGMT-SOURCE-LOOPBACK
 ip address 10.10.10.10 255.255.255.255
!
interface GigabitEthernet0/0
 description EXTERNAL-UNTRUSTED
 ip address 198.51.100.2 255.255.255.252
 ip access-group ACL-EXTERNAL-IN in
 ip verify unicast source reachable-via rx allow-default
 no ip proxy-arp
 no shutdown
!
interface GigabitEthernet0/1
 description INTERNAL-TRUSTED
 ip address 10.1.0.1 255.255.255.0
 ip ospf message-digest-key 1 md5 CHANGE_ME_Ospf#Key2026
 no ip proxy-arp
 no shutdown
!
interface GigabitEthernet0/2
 description MGMT-ZONE
 ip address 10.1.1.1 255.255.255.0
 no ip proxy-arp
 no shutdown
!
! Remove any existing tunnel interfaces (run for each instance present):
! no interface Tunnel0
!
! ---------------------------------------------------------------------------
! EIGRP (NAMED MODE) WITH MD5 AUTHENTICATION
! ---------------------------------------------------------------------------
router eigrp CORE-EIGRP
 !
 address-family ipv4 unicast autonomous-system 100
  !
  af-interface default
   passive-interface
  exit-af-interface
  !
  af-interface GigabitEthernet0/1
   no passive-interface
   authentication mode md5
   authentication key-chain EIGRP-KEYCHAIN
  exit-af-interface
  !
  topology base
  exit-af-topology
  network 10.1.0.0 0.0.0.255
 exit-address-family
!
! Classic-mode EIGRP equivalent (use INSTEAD of named mode, not together):
! router eigrp 100
!  network 10.1.0.0 0.0.0.255
! interface GigabitEthernet0/1
!  ip authentication mode eigrp 100 md5
!  ip authentication key-chain eigrp 100 EIGRP-KEYCHAIN
!
! ---------------------------------------------------------------------------
! OSPF WITH MESSAGE-DIGEST AUTHENTICATION
! ---------------------------------------------------------------------------
router ospf 1
 router-id 10.10.10.10
 area 0 authentication message-digest
 passive-interface default
 no passive-interface GigabitEthernet0/1
 network 10.1.0.0 0.0.0.255 area 0
!
! ---------------------------------------------------------------------------
! BGP WITH NEIGHBOR AUTHENTICATION
! ---------------------------------------------------------------------------
router bgp 65001
 bgp log-neighbor-changes
 neighbor 198.51.100.1 remote-as 65002
 neighbor 198.51.100.1 password CHANGE_ME_Bgp#Key2026
!
! ---------------------------------------------------------------------------
! HTTP / HTTPS MANAGEMENT
! ---------------------------------------------------------------------------
no ip http server
ip http secure-server
ip http authentication aaa login-authentication default
ip http max-connections 2
ip http timeout-policy idle 600 life 86400 requests 10000
!
ip tftp source-interface Loopback0
!
! ---------------------------------------------------------------------------
! ACCESS LISTS
! ---------------------------------------------------------------------------
! ACL 100 - VTY management access (SSH from management zone only)
access-list 100 permit tcp 10.1.1.0 0.0.0.255 any eq 22
access-list 100 permit tcp host 10.1.1.50 any eq 22
access-list 100 deny   ip any any log
!
! ACL 99 - SNMP access (authorized NMS only)
access-list 99 permit 10.1.1.20
access-list 99 permit 10.1.1.21
access-list 99 deny   any log
!
! Anti-spoofing / private source restrictions on external interface
ip access-list extended ACL-EXTERNAL-IN
 deny   ip 10.1.0.0 0.0.255.255 any log
 deny   ip 127.0.0.0 0.255.255.255 any log
 deny   ip 10.0.0.0 0.255.255.255 any log
 deny   ip 0.0.0.0 0.255.255.255 any log
 deny   ip 172.16.0.0 0.15.255.255 any log
 deny   ip 192.168.0.0 0.0.255.255 any log
 deny   ip 192.0.2.0 0.0.0.255 any log
 deny   ip 169.254.0.0 0.0.255.255 any log
 deny   ip 224.0.0.0 31.255.255.255 any log
 deny   ip host 255.255.255.255 any log
 permit tcp host 198.51.100.1 host 198.51.100.2 eq bgp log
 permit tcp host 198.51.100.1 eq bgp host 198.51.100.2 log
 permit tcp any 203.0.113.0 0.0.0.255 eq 443 log
 permit tcp any any established
 deny   ip any any log
!
! ---------------------------------------------------------------------------
! SNMP
! If SNMP is NOT used to monitor/manage the device, replace this whole block
! with:  no snmp-server
! ---------------------------------------------------------------------------
no snmp-server community private
no snmp-server community public
! Remove any write community that exists, e.g.:
! no snmp-server community CHANGE_ME_OldRwCommunity
!
snmp-server community CHANGE_ME_Ro#Community2026 RO 99
snmp-server group SNMPV3-GROUP v3 priv access 99
! snmp-server user is stored separately and does NOT appear in running-config
snmp-server user snmpadmin SNMPV3-GROUP v3 auth sha CHANGE_ME_SnmpAuth#2026 priv aes 128 CHANGE_ME_SnmpPriv#2026 access 99
snmp-server trap-source Loopback0
snmp-server enable traps snmp authentication linkdown linkup coldstart
snmp-server host 10.1.1.20 CHANGE_ME_Trap#Community2026 snmp
!
! ---------------------------------------------------------------------------
! NTP (authenticated)
! ---------------------------------------------------------------------------
ntp authentication-key 1 md5 CHANGE_ME_Ntp#Key2026
ntp authenticate
ntp trusted-key 1
ntp source Loopback0
ntp server 10.1.1.40 key 1
ntp server 10.1.1.41 key 1
! VRF-aware alternative:
! ntp server vrf MGMT 10.1.1.40 key 1
!
! ---------------------------------------------------------------------------
! BANNERS
! ---------------------------------------------------------------------------
banner exec ^C
*********************************************************************
 You are logged in to a restricted network device.
 All commands are logged and audited.
*********************************************************************
^C
banner login ^C
*********************************************************************
 AUTHORIZED ACCESS ONLY. Unauthorized access is prohibited and
 will be prosecuted. Activity on this device is monitored.
*********************************************************************
^C
banner motd ^C
*********************************************************************
 NOTICE: This system is the property of EXAMPLE ORG.
 Use is restricted to authorized personnel only.
*********************************************************************
^C
ip admission auth-proxy-banner http ^C
Authorized access only. All activity is monitored and logged.
^C
!
! ---------------------------------------------------------------------------
! MANAGEMENT LINES
! ---------------------------------------------------------------------------
line con 0
 exec-timeout 10 0
 login authentication default
 logging synchronous
!
line aux 0
 exec-timeout 10 0
 no exec
 transport input none
 transport output none
!
line vty 0 4
 access-class 100 in
 exec-timeout 10 0
 login authentication default
 transport input ssh
!
line vty 5 15
 access-class 100 in
 exec-timeout 10 0
 login authentication default
 transport input ssh
!
end
